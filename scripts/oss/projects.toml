# The open-source projects hod's real-project lane (L11) builds through
# their own build systems with kiln as the compiler (docs/VALIDATION.md
# "Real projects (L11)", spec/harness.md "Real projects").
#
# A port of kiln's scripts/oss/projects.toml (kiln:spec/landed/harness/
# WP-666.md): the format is kiln's, so a row can be copied from kiln's file
# unchanged. The rows below are copies of kiln's at the pinned kiln; their
# `notes` (and the WP numbers in them) are kiln's. The lane builds every
# row at -O0 (flavour O0) and -O0 -g (flavour O0g), whatever build type a
# row's configure names, so the keys the lane does not use (`sweep`,
# `wave`, `verified`) are kept only for copying.
#
#   url            git URL (cloned with --depth 1 --branch <tag>)
#   tag            pinned release tag
#   build          cmake (the only build system the lane drives today)
#   cxx_std        CMAKE_CXX_STANDARD
#   configure      extra configure flags, a list
#   build_targets  optional list of make targets (default: all)
#   test           shell command run in the build dir under `timeout <test_timeout>`
#   c              "clang" (default): C TUs go to `c_compiler` directly,
#                  unlogged, in every mode; "kiln": C TUs go through
#                  scripts/oss/kiln-cc, the kiln C driver in every mode
#                  (with hod in the hod modes)
#   c_compiler     the C compiler of a c = "clang" row, default clang-19
#   deps           cmake rows built and installed first, same flavour and mode
#   install_configure  configure flags of a dependency build
#   submodules     optional: clone with --recurse-submodules
#   source_subdir  optional: the CMake source dir inside the checkout
#   test_timeout   seconds, default 1800
#   vmem_kb        the address-space cap of one compile or test, default 3000000
#   drop_flags     optional: compiler arguments the wrappers leave out of every
#                  kiln command (a flag kiln does not accept that the project
#                  hard-codes, e.g. highway's -fmerge-all-constants), in every mode
#   notes          free text

[fmt]
url = "https://github.com/fmtlib/fmt"
tag = "12.1.0"
build = "cmake"
cxx_std = 20
configure = ["-DFMT_TEST=ON", "-DFMT_DOC=OFF", "-DFMT_PEDANTIC=OFF"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 1
sweep = true
verified = false
notes = "WP-667 drives this one with its own wrapper until the harness lands."

[googletest]
url = "https://github.com/google/googletest"
tag = "v1.17.0"
build = "cmake"
cxx_std = 20
configure = ["-Dgtest_build_tests=ON", "-Dgmock_build_tests=ON", "-DPython3_EXECUTABLE=/usr/bin/python3"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 1
verified = true
notes = "Harness verification project (WP-666). Some ctest cases are python3 scripts driving the built binaries."
install_configure = ["-DBUILD_GMOCK=ON", "-DINSTALL_GTEST=ON"]

[abseil]
url = "https://github.com/abseil/abseil-cpp"
tag = "20260107.1"
build = "cmake"
cxx_std = 17
configure = ["-DABSL_BUILD_TESTING=ON", "-DABSL_USE_GOOGLETEST_HEAD=ON", "-DBUILD_TESTING=ON"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 2
sweep = true
verified = true
notes = "LTS release. googletest is downloaded at configure time (ABSL_USE_GOOGLETEST_HEAD)."
install_configure = ["-DABSL_BUILD_TESTING=OFF", "-DABSL_ENABLE_INSTALL=ON", "-DABSL_PROPAGATE_CXX_STD=ON"]

[re2]
url = "https://github.com/google/re2"
tag = "2025-11-05"
build = "cmake"
cxx_std = 17
configure = ["-DRE2_BUILD_TESTING=ON"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 2
verified = true
deps = ["abseil", "googletest", "benchmark"]
notes = "abseil, googletest and benchmark are built and installed with the same compiler first (deps)."

[benchmark]
url = "https://github.com/google/benchmark"
tag = "v1.9.5"
build = "cmake"
cxx_std = 17
configure = ["-DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON", "-DBENCHMARK_ENABLE_TESTING=ON", "-DBENCHMARK_ENABLE_WERROR=OFF", "-DBENCHMARK_ENABLE_LTO=OFF"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 2
verified = true
notes = "googletest is downloaded at configure time."
install_configure = ["-DBENCHMARK_ENABLE_TESTING=OFF", "-DBENCHMARK_ENABLE_INSTALL=ON", "-DBENCHMARK_ENABLE_WERROR=OFF", "-DBENCHMARK_ENABLE_LTO=OFF"]

[protobuf]
url = "https://github.com/protocolbuffers/protobuf"
tag = "v33.1"
build = "cmake"
cxx_std = 17
configure = ["-Dprotobuf_BUILD_TESTS=ON", "-Dprotobuf_FORCE_FETCH_DEPENDENCIES=ON", "-Dprotobuf_BUILD_CONFORMANCE=OFF"]
submodules = false
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 3
verified = true
notes = "No submodules: configure fetches Abseil 20250512.1 and GoogleTest 1.15.2 (FetchContent), compiled with the same compiler. ctest runs lite-test, full-test, lazily-build-dependencies-test and upb-test."

[spdlog]
url = "https://github.com/gabime/spdlog"
tag = "v1.17.0"
build = "cmake"
cxx_std = 20
configure = ["-DSPDLOG_BUILD_TESTS=ON", "-DSPDLOG_BUILD_EXAMPLE=OFF"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 1
verified = true
notes = "Tests fetch Catch2 v3.5.0 with FetchContent (built with the same compiler); bundled fmt by default. One ctest test (spdlog-utests: 179 Catch2 cases). WP-680."

[catch2]
url = "https://github.com/catchorg/Catch2"
tag = "v3.16.1"
build = "cmake"
cxx_std = 20
configure = ["-DCATCH_DEVELOPMENT_BUILD=ON", "-DCATCH_BUILD_TESTING=ON", "-DCATCH_ENABLE_WERROR=OFF", "-DCATCH_BUILD_EXAMPLES=OFF"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 1
verified = true
notes = "Some ctest cases run python3 scripts (ApprovalTests)."

[nlohmann_json]
url = "https://github.com/nlohmann/json"
tag = "v3.12.0"
build = "cmake"
cxx_std = 20
configure = ["-DJSON_BuildTests=ON", "-DJSON_MultipleHeaders=ON"]
test = "ctest --output-on-failure -LE git_required"
c_compiler = "clang-19"
wave = 1
sweep = true
verified = false
notes = "WP-668. The test data repo is downloaded at configure time; many tests build per -std (JSON_TestStandards)."

[yaml_cpp]
url = "https://github.com/jbeder/yaml-cpp"
tag = "yaml-cpp-0.9.0"
build = "cmake"
cxx_std = 17
configure = ["-DYAML_CPP_BUILD_TESTS=ON", "-DYAML_CPP_BUILD_TOOLS=OFF", "-DCMAKE_CXX_FLAGS=-Wno-c++11-narrowing"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 2
verified = true
notes = "Tests use a vendored googletest."

[glog]
url = "https://github.com/google/glog"
tag = "v0.7.1"
build = "cmake"
cxx_std = 17
configure = ["-DBUILD_TESTING=ON", "-DWITH_GFLAGS=OFF", "-DWITH_GTEST=OFF", "-DWITH_UNWIND=OFF"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 2
verified = true
notes = "Archived upstream; v0.7.1 is the last release."

[leveldb]
url = "https://github.com/google/leveldb"
tag = "1.23"
build = "cmake"
cxx_std = 17
configure = ["-DLEVELDB_BUILD_TESTS=ON", "-DLEVELDB_BUILD_BENCHMARKS=OFF", "-DCMAKE_CXX_FLAGS=-Wno-error=deprecated-copy -Wno-error=unused-but-set-variable"]
submodules = true
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 3
verified = true
notes = "googletest and benchmark are submodules; their old sources trip clang 19 -Wdeprecated-copy and -Wunused-but-set-variable under leveldb's -Werror, hence the -Wno-error flags."

[cli11]
url = "https://github.com/CLIUtils/CLI11"
tag = "v2.6.1"
build = "cmake"
cxx_std = 20
configure = ["-DCLI11_BUILD_TESTS=ON", "-DCLI11_BUILD_EXAMPLES=ON", "-DCLI11_WARNINGS_AS_ERRORS=OFF"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 1
verified = true
notes = "Tests download the Catch2 single header (or use an installed Catch2)."

[doctest]
url = "https://github.com/doctest/doctest"
tag = "v2.5.3"
build = "cmake"
cxx_std = 20
configure = ["-DDOCTEST_WITH_TESTS=ON", "-DDOCTEST_WITH_MAIN_IN_STATIC_LIB=ON"]
test = "ctest --output-on-failure --timeout 300 -E test_debugger"
c_compiler = "clang-19"
wave = 1
verified = true
notes = "The test CMake turns warnings into errors for clang-identified compilers; a kiln-only warning becomes a reject. test_debugger is excluded: on aarch64 its SIGTRAP handler returns to the brk of __builtin_debugtrap and loops forever (clang-19 build too)."

[simdjson]
url = "https://github.com/simdjson/simdjson"
tag = "v4.2.4"
build = "cmake"
cxx_std = 20
configure = ["-DSIMDJSON_DEVELOPER_MODE=ON", "-DSIMDJSON_ENABLE_THREADS=ON", "-DSIMDJSON_EXCEPTIONS=ON"]
test = "ctest --output-on-failure -E 'checkperf|fuzz'"
c_compiler = "clang-19"
wave = 2
verified = true
notes = "Developer mode downloads test data; target-specific SIMD kernels (NEON on aarch64, AVX on x86_64) exercise intrinsics headers."

[magic_enum]
url = "https://github.com/Neargye/magic_enum"
tag = "v0.9.7"
build = "cmake"
cxx_std = 20
configure = ["-DMAGIC_ENUM_OPT_BUILD_TESTS=ON", "-DMAGIC_ENUM_OPT_BUILD_EXAMPLES=ON"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 1
verified = true
notes = "Harness verification project (WP-666). Enum reflection through __PRETTY_FUNCTION__ parsing; tests use the bundled Catch2 v2 header and -Werror."

[tl_expected]
url = "https://github.com/TartanLlama/expected"
tag = "v1.3.1"
build = "cmake"
cxx_std = 20
configure = ["-DEXPECTED_BUILD_TESTS=ON"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 1
verified = true
notes = "Tests fetch Catch2 with FetchContent."

[zlib]
url = "https://github.com/madler/zlib"
tag = "v1.3.2"
build = "cmake"
cxx_std = 17
c = "kiln"
configure = ["-DZLIB_BUILD_TESTING=ON"]
test = "ctest --output-on-failure -E 'install|find_package|add_subdirectory' && for lvl in -1 -6 -9 -h -r -f; do test/minigzip $lvl -c < libz.a > \"$TMPDIR/z.gz\" && test/minigzip -d -c < \"$TMPDIR/z.gz\" | cmp - libz.a || exit 1; done && echo 'minigzip round trips ok'"
wave = 5
verified = true
notes = "WP-1277. The shared and static example/example64 programs and infcover through ctest (the install, find_package and add_subdirectory tests reconfigure CMake sub-builds with the default compilers: excluded), then a minigzip compress/decompress round trip of libz.a at levels 1, 6, 9 and the Huffman-only, RLE and filtered strategies."

[zstd]
url = "https://github.com/facebook/zstd"
tag = "v1.5.7"
build = "cmake"
source_subdir = "build/cmake"
cxx_std = 17
c = "kiln"
configure = ["-DZSTD_BUILD_TESTS=ON", "-DZSTD_FUZZER_FLAGS=-T60s", "-DZSTD_ZSTREAM_FLAGS=-T60s", "-DZSTD_FULLBENCH_FLAGS=-i1"]
# The lane drops kiln's playTests.sh step: it runs under /tmp, outside the workspace.
test = "ctest --output-on-failure -E playTests"

wave = 5
verified = true
notes = "WP-1277. Heavy macro and inline-function C (bit streams, Huffman and FSE tables, SIMD-free paths on aarch64; the x86_64 decoder's .S goes through kiln-cc as assembly). ctest runs fullbench, fuzzer and zstreamtest (60 s each); playTests.sh then runs the built zstd CLI from a /tmp directory (it checks file modes under umask 0000, which the workspace file system does not honour, so under ctest's tests/ cwd it fails for any compiler)."

# ------------------------------------------------ the second set (WP-200)
# Chosen for what the rows above do not reach: vector intrinsics and
# function multiversioning (simdjson above, highway, Eigen), template-heavy
# libraries (range-v3, Boost), x86-64 first. Their findings live apart
# (HOD_OSS_ROOT=<build root>/oss2, HOD_OSS_FINDINGS=<build root>/findings/oss2).

[highway]
url = "https://github.com/google/highway"
tag = "1.4.0"
build = "cmake"
cxx_std = 17
vmem_kb = 6000000  # kiln -O0 -g on convert_test and memory_test needs more than 3 GB
configure = ["-DHWY_ENABLE_TESTS=ON", "-DHWY_ENABLE_CONTRIB=OFF", "-DHWY_ENABLE_EXAMPLES=OFF", "-DHWY_ENABLE_INSTALL=OFF", "-DHWY_WARNINGS_ARE_ERRORS=OFF", "-DHWY_SYSTEM_GTEST=OFF", "-DBUILD_TESTING=ON", "-DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST"]
build_targets = ["base_test", "highway_test", "targets_test", "aligned_allocator_test", "arithmetic_test", "blockwise_test", "cast_test", "combine_test", "compare_test", "compress_test", "convert_test", "crypto_test", "demote_test", "div_test", "float_test", "fma_test", "interleaved_test", "logical_test", "mask_test", "memory_test", "minmax_test", "mul_test", "reduction_test", "saturated_test", "shift_test", "shuffle4_test", "swizzle_test", "table_test"]
# One ctest test per test program (gtest_discover_tests would make one
# per case and target, thousands of qemu starts): whole/CTestTestfile.cmake
# runs each built program once, under the cross build's emulator if any.
test = "mkdir -p whole && emu=$(sed -n 's/^CMAKE_CROSSCOMPILING_EMULATOR:[A-Z]*=//p' CMakeCache.txt | tr ';' ' ') && for t in tests/*_test; do if [ -x \"$t\" ]; then echo \"add_test($(basename $t) $emu $PWD/$t)\"; fi; done > whole/CTestTestfile.cmake && cd whole && ctest --output-on-failure --timeout 3600"
test_timeout = 7200
c_compiler = "clang-19"
# kiln does not accept it; highway adds it to every compile (an optimization only).
drop_flags = ["-fmerge-all-constants"]
notes = "WP-200. Portable SIMD with per-target code: each test is compiled once per attainable target (x86-64: SSE2, SSSE3, SSE4, AVX2, the AVX-512 variants; each in a `#pragma clang attribute push(__attribute__((target(...))))` region, HWY_BEFORE_NAMESPACE) and run for every target the CPU has (qemu-x86_64: up to AVX2). 28 of the core op tests (hwy/tests), each program run once as one test. Needs kiln 21caaf874 or later (the pragma); googletest is downloaded at configure time."

[range_v3]
url = "https://github.com/ericniebler/range-v3"
tag = "0.12.0"
build = "cmake"
cxx_std = 20
configure = ["-DRANGE_V3_TESTS=ON", "-DRANGE_V3_EXAMPLES=ON", "-DRANGE_V3_PERF=OFF", "-DRANGE_V3_DOCS=OFF", "-DRANGE_V3_HEADER_CHECKS=OFF", "-DRANGES_ENABLE_WERROR=OFF", "-DCMAKE_CXX_FLAGS=-Wno-deprecated-ofast"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
notes = "WP-200, kiln's row (kiln WP-669). Header-only; the test suite is the build (hundreds of TUs, heavy concept checking)."

[eigen]
url = "https://gitlab.com/libeigen/eigen.git"
tag = "3.4.1"
build = "cmake"
cxx_std = 17
configure = ["-DBUILD_TESTING=ON", "-DEIGEN_BUILD_DOC=OFF", "-DEIGEN_BUILD_BLAS=OFF", "-DEIGEN_BUILD_LAPACK=OFF"]
build_targets = ["basicstuff", "packetmath", "vectorization_logic", "redux", "block", "product_small", "product_large", "determinant", "inverse", "cholesky", "lu", "qr", "qr_colpivoting", "jacobisvd", "eigensolver_generic", "schur_real", "householder", "geo_quaternion", "geo_transformations", "sparse_basic", "sparse_product", "simplicial_cholesky", "conjugate_gradient", "sparselu", "array_cwise", "half_float", "bfloat16_float", "stl_iterators", "indexed_view", "reshape", "dense_storage", "special_numbers", "fastmath", "autodiff", "matrix_function", "splines", "special_functions", "cxx11_tensor_contraction", "cxx11_tensor_broadcasting", "cxx11_tensor_reduction", "cxx11_tensor_morphing", "cxx11_non_blocking_thread_pool"]
test = "EIGEN_SEED=12345 EIGEN_REPEAT=1 ctest --output-on-failure -R '^(basicstuff|packetmath|vectorization_logic|redux|block|product_small|product_large|determinant|inverse|cholesky|lu|qr|qr_colpivoting|jacobisvd|eigensolver_generic|schur_real|householder|geo_quaternion|geo_transformations|sparse_basic|sparse_product|simplicial_cholesky|conjugate_gradient|sparselu|array_cwise|half_float|bfloat16_float|stl_iterators|indexed_view|reshape|dense_storage|special_numbers|fastmath|autodiff|matrix_function|splines|special_functions|cxx11_tensor_contraction|cxx11_tensor_broadcasting|cxx11_tensor_reduction|cxx11_tensor_morphing|cxx11_non_blocking_thread_pool)(_[0-9]+)?$'"
c_compiler = "clang-19"
notes = "WP-200. GitLab, not GitHub. 42 of the suite's tests across modules (core, packet math, decompositions, geometry, sparse, unsupported tensor and autodiff), from kiln's 132-test subset (kiln's eigen row); each test is split into parts (<name>_<n>), one executable each. The test runs use a fixed seed and one repeat (EIGEN_SEED, EIGEN_REPEAT): the default seed is the time, so control and hod would draw different matrices, and ten repeats of product_large under the x86-64 emulator take over 20 minutes per part."

[simdjson_haswell]
url = "https://github.com/simdjson/simdjson"
tag = "v4.2.4"
checkout = "simdjson"
build = "cmake"
cxx_std = 20
configure = ["-DSIMDJSON_DEVELOPER_MODE=ON", "-DSIMDJSON_ENABLE_THREADS=ON", "-DSIMDJSON_EXCEPTIONS=ON", "-DCMAKE_CXX_FLAGS=-march=haswell -DSIMDJSON_IMPLEMENTATION_ICELAKE=0"]
test = "ctest --output-on-failure -E 'checkperf|fuzz'"
c_compiler = "clang-19"
notes = "WP-200, x86-64 only. The simdjson row's runtime dispatch puts each x86-64 kernel (westmere, haswell, icelake) in a `#pragma clang attribute push(__attribute__((target(...))))` region, which kiln rejects ('#pragma clang attribute' is not supported yet); built for Haswell (-march=haswell: AVX2, BMI1/2, PCLMUL, LZCNT, POPCNT in every function) with the icelake kernel off, the haswell kernel is the built-in one and needs no region. qemu-x86_64 runs AVX2."

[boost_tmpl]
url = "https://github.com/boostorg/boost"
tag = "boost-1.90.0"
checkout = "boost"
submodules = true
build = "cmake"
cxx_std = 20
configure = [
  "-DBUILD_TESTING=ON", "-DBUILD_SHARED_LIBS=OFF",
  "-DBOOST_INCLUDE_LIBRARIES=mp11;variant2;describe;container;unordered;json;multi_index;spirit",
  "-DCMAKE_PROJECT_Boost_INCLUDE=@KILN_OSS@/shims/boost-jamfile-tests.cmake",
  "-DKILN_BOOST_JAMFILE_LIBRARIES=multi_index;spirit",
  "-DKILN_BOOST_JAMFILE_SKIP_spirit=^(karma|lex|qi|support|test_headers)_",
]
build_targets = ["tests"]
test = "ctest --output-on-failure --timeout 1200"
test_timeout = 7200
c_compiler = "clang-19"
notes = "WP-200. Eight template-heavy Boost libraries with their own tests: mp11, variant2, describe, container, unordered, json (CMake tests), multi_index and Spirit X3 (b2-only tests, registered by kiln's shim boost-jamfile-tests.cmake, read from kiln's scripts/oss; Spirit's Qi, Karma and Lex tests left out)."
